name: Docker Image

on:
  workflow_dispatch:
    inputs:
      alert-server:
        description: Build on buildkit of alert-server when it answers. Off builds on GitHub.
        type: boolean
        default: true
      push:
        description: Push the image of a run on a branch other than main, with the branch name as the tag.
        type: boolean
        default: false

  push:
    branches:
      - "main"
    tags:
      - "*"
    paths-ignore:
      - ".pre-commit-config.yaml"
      - "script"
      - "userscripts/**"
      - "media/**"
      - "**/*.md"
      - ".github/dependabot.yml"

  # a pull request builds the image without a push
  pull_request:
    branches:
      - "main"
    paths-ignore:
      - ".pre-commit-config.yaml"
      - "script"
      - "userscripts/**"
      - "media/**"
      - "**/*.md"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # a pull request runs tests.yml through its own trigger
    if: github.event_name != 'pull_request'
    uses: $/.github/workflows/tests.yml
    permissions:
      contents: read # checkout

  build-and-publish:
    needs: test
    # the skipped test job of a pull request does not stop the build
    if: ${{ !failure() && !cancelled() }}
    # builds on buildkit of alert-server when it answers through the tailnet, otherwise on GitHub
    uses: ALERTua/ci-workflows/.github/workflows/docker-build.yml@v4.0.0
    permissions:
      contents: read # checkout
      packages: write # push of the image to ghcr.io
      id-token: write # Tailscale accepts the GitHub OIDC token instead of a key
    with:
      alert-server: ${{ github.event_name != 'workflow_dispatch' || inputs.alert-server }}
      push: ${{ github.event_name == 'workflow_dispatch' && inputs.push }}
