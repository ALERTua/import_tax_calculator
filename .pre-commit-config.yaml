ci:
  # tests are checked in a github runner
  skip: [uv-lock, pytest]

repos:
  - repo: https://codeberg.org/lig/todo-md.git
    rev: v2.0.3
    hooks:
      - id: todo-md

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    - id: check-merge-conflict
    - id: check-added-large-files
    - id: check-builtin-literals
    - id: check-case-conflict
    - id: check-toml
    - id: check-docstring-first
    - id: end-of-file-fixer
    - id: mixed-line-ending
    - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.13
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # https://docs.astral.sh/uv/guides/integration/pre-commit/
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.11.14
    hooks:
      - id: uv-lock

  - repo: https://github.com/abravalheri/validate-pyproject
    rev: v0.25
    hooks:
      - id: validate-pyproject
        # Optional extra validations from SchemaStore:
        additional_dependencies: [ "validate-pyproject-schema-store[all]" ]

  - repo: local
    hooks:
      - id: django-makemigrations-check
        name: django makemigrations --check
        entry: uv run python manage.py makemigrations --check --dry-run
        language: system
        pass_filenames: false
        files: '(models\.py|/migrations/.*\.py)$'
